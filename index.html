<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard Multistream</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="app-layout">
        <!-- Columna de Video (Izquierda/Centro) -->
        <main class="video-container">
            <!-- Fuente Principal (MiluLive o reproductor HLS personalizado) -->
            <section class="video-card main-stream">
                <div class="card-header">Video Principal</div>
                <div class="media-wrapper">
                    <iframe 
                        src="https://player.twitch.tv/?channel=pedacitosdeterror&enableExtensions=true&muted=true&parent=localhost&player=popout&quality=1080p&volume=0.09" 
                        allowfullscreen 
                        scrolling="no">
                    </iframe>
                </div>
            </section>

            <!-- Fuente Secundaria (Kick Stream) -->
            <section class="video-card secondary-stream">
                <div class="card-header">Kick - Stream Secundario</div>
                <div class="media-wrapper">
                    <!-- Reemplaza 'tu_canal_kick' por el nombre real del canal -->
                    <iframe 
                        src="https://player.kick.com/pedacitosdeterror" 
                        allowfullscreen 
                        scrolling="no">
                    </iframe>
                </div>
            </section>
        </main>

        <!-- Columna de Chat (Derecha) -->
        <aside class="chat-container">
            <div class="card-header">Chat de Kick</div>
            <!-- Reemplaza 'tu_canal_kick' por el nombre real del canal -->
            <iframe 
                src="https://kick.com/popout/pedacitosdeterror/chat" 
                scrolling="no">
            </iframe>
        </aside>
    </div>
</body>
</html>
