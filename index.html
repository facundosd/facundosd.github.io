<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard Multistream</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="app-layout">
        <!-- Columna Principal: Video (Izquierda) -->
        <main class="main-content">
            <section class="video-card main-stream">
                <div class="card-header">Video Principal</div>
                <div class="media-wrapper">
                    <video id="mainPlayer" controls autoplay playsinline>
                        <source src="https://test-streams.mux.dev/x36xhzz/x36xhzz.m3u8" type="application/x-mpegurl">
                        Tu navegador no soporta reproducción HLS.
                    </video>
                </div>
            </section>
        </main>

        <!-- Columna Secundaria: Kick Stream + Chat (Derecha) -->
        <aside class="sidebar">
            <!-- Kick Stream Secundario -->
            <section class="video-card secondary-stream">
                <div class="card-header">Kick - Stream Secundario</div>
                <div class="media-wrapper">
                    <!-- Reemplaza 'tu_canal_kick' por el canal real -->
                    <iframe 
                        src="https://player.kick.com/pedacitosdeterror" 
                        allowfullscreen 
                        scrolling="no">
                    </iframe>
                </div>
            </section>

            <!-- Chat de Kick -->
            <section class="chat-card">
                <div class="card-header">Chat de Kick</div>
                <div class="media-wrapper">
                    <!-- Reemplaza 'tu_canal_kick' por el canal real -->
                    <iframe 
                        src="https://kick.com/popout/pedacitosdeterror/chat" 
                        scrolling="no">
                    </iframe>
                </div>
            </section>
        </aside>
    </div>
</body>
</html>
