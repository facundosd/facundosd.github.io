<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard Multistream</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="app-layout">
        <!-- Columna Izquierda: Video Kick -->
        <main class="card main-kick">
            <div class="card-header">Video Kick</div>
            <div class="media-wrapper">
                <iframe 
                    src="https://player.kick.com/pedacitosdeterror" 
                    allowfullscreen 
                    scrolling="no">
                </iframe>
            </div>
        </main>

        <!-- Columna Derecha (Sidebar): Twitch arriba, Chat abajo -->
        <aside class="sidebar">
            <section class="card side-twitch">
                <div class="card-header">Video Twitch</div>
                <div class="media-wrapper">
                    <iframe 
                        src="https://player.twitch.tv/?channel=pedacitosdeterror&enableExtensions=true&muted=false&parent=localhost&parent=127.0.0.1&player=popout&quality=1080p&volume=0.09" 
                        allowfullscreen 
                        scrolling="no">
                    </iframe>
                </div>
            </section>

            <section class="card side-chat">
                <div class="card-header">Chat</div>
                <div class="media-wrapper">
                    <iframe 
                        src="https://kick.com/popout/pedacitosdeterror/chat" 
                        scrolling="no">
                    </iframe>
                </div>
            </section>
        </aside>
    </div>
</body>
</html>
