<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard Multistream</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="app-layout">
        <!-- Video Principal (Kick) -->
        <section class="card main-kick">
            <div class="card-header">Video Kick</div>
            <div class="media-wrapper">
                <iframe 
                    src="https://player.kick.com/pedacitosdeterror" 
                    allowfullscreen 
                    scrolling="no">
                </iframe>
            </div>
        </section>

        <!-- Video Secundario (Twitch) -->
        <section class="card side-twitch">
            <div class="card-header">Video Twitch</div>
            <div class="media-wrapper">
                <!-- Cambia parent=localhost por tu dominio en producción -->
                <iframe 
                    src="https://player.twitch.tv/?channel=pedacitosdeterror&enableExtensions=true&muted=true&parent=localhost&player=popout&quality=1080p&volume=0.09" 
                    allowfullscreen 
                    scrolling="no">
                </iframe>
            </div>
        </section>

        <!-- Chat de Kick -->
        <section class="card side-chat">
            <div class="card-header">Chat</div>
            <div class="media-wrapper">
                <iframe 
                    src="https://kick.com/popout/pedacitosdeterror/chat" 
                    scrolling="no">
                </iframe>
            </div>
        </section>
    </div>
</body>
</html>
