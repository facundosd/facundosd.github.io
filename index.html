<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard Multistream</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="app-layout">
        <!-- Columna Principal: Video Principal Twitch (Izquierda) -->
        <main class="main-content">
            <section class="video-card main-stream">
                <div class="card-header">Video Principal (Twitch)</div>
                <div class="media-wrapper">
                    <!-- Recuerda: Si la página la subes a un servidor real, cambia parent=localhost por tu dominio (ej: parent=tudominio.com) -->
                    <iframe 
                        src="https://player.twitch.tv/?channel=pedacitosdeterror&enableExtensions=true&muted=true&parent=localhost&player=popout&quality=1080p&volume=0.09" 
                        allowfullscreen 
                        scrolling="no">
                    </iframe>
                </div>
            </section>
        </main>

        <!-- Columna Secundaria: Kick Stream + Chat (Derecha) -->
        <aside class="sidebar">
            <!-- Stream Secundario Kick -->
            <section class="video-card secondary-stream">
                <div class="card-header">Kick - Stream Secundario</div>
                <div class="media-wrapper">
                    <iframe 
                        src="https://player.kick.com/pedacitosdeterror" 
                        allowfullscreen 
                        scrolling="no">
                    </iframe>
                </div>
            </section>

            <!-- Chat de Kick -->
            <section class="chat-card">
                <div class="card-header">Chat de Kick</div>
                <div class="media-wrapper">
                    <iframe 
                        src="https://kick.com/popout/pedacitosdeterror/chat" 
                        scrolling="no">
                    </iframe>
                </div>
            </section>
        </aside>
    </div>
</body>
</html>
